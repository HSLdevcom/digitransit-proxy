name: Process master push or pr
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: 24.14.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node, install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run tests
        run: yarn test
  docker-push:
    if: github.ref == 'refs/heads/master'
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build docker image from master and push it
        run: ./.github/workflows/scripts/build_and_push_dev.sh
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_AUTH: ${{ secrets.DOCKER_AUTH }}
          DOCKER_BASE_TAG: latest
  generate-sbom:
    if: github.ref == 'refs/heads/master'
    needs:
      - test
    uses: ./.github/workflows/generate-sbom.yml
    secrets: inherit
    with:
      artifact-name: sbom-artifact-${{ github.ref_name }}
